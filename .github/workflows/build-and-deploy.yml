name: Build and Deploy (Contabo)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: contabo-production
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/slimx-chat-canvas
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      APP_DIR: /opt/slimx-chat-canvas
      GHCR_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      SLIMX_MODEL: ${{ vars.SLIMX_MODEL }}
      SLIMX_TEMPERATURE: ${{ vars.SLIMX_TEMPERATURE }}
      SLIMX_MAX_TOKENS: ${{ vars.SLIMX_MAX_TOKENS }}
      SLIMX_TIMEOUT: ${{ vars.SLIMX_TIMEOUT }}
      SLIMX_RETRIES: ${{ vars.SLIMX_RETRIES }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ANTHROPIC_VERSION: ${{ vars.ANTHROPIC_VERSION }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Contabo app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script_stop: true
          script: |
            mkdir -p /opt/slimx-chat-canvas

      - name: Copy deployment files to Contabo
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/deploy.sh"
          target: "/opt/slimx-chat-canvas"
          strip_components: 1
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          GHCR_OWNER: ${{ env.GHCR_OWNER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ env.GHCR_USER }}
          GHCR_PAT: ${{ env.GHCR_PAT }}
          SLIMX_MODEL: ${{ env.SLIMX_MODEL }}
          SLIMX_TEMPERATURE: ${{ env.SLIMX_TEMPERATURE }}
          SLIMX_MAX_TOKENS: ${{ env.SLIMX_MAX_TOKENS }}
          SLIMX_TIMEOUT: ${{ env.SLIMX_TIMEOUT }}
          SLIMX_RETRIES: ${{ env.SLIMX_RETRIES }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ env.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
          ANTHROPIC_VERSION: ${{ env.ANTHROPIC_VERSION }}
          OLLAMA_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: APP_DIR,GHCR_OWNER,IMAGE_TAG,GHCR_USER,GHCR_PAT,SLIMX_MODEL,SLIMX_TEMPERATURE,SLIMX_MAX_TOKENS,SLIMX_TIMEOUT,SLIMX_RETRIES,OPENAI_API_KEY,OPENAI_BASE_URL,ANTHROPIC_API_KEY,ANTHROPIC_BASE_URL,ANTHROPIC_VERSION,OLLAMA_BASE_URL
          script_stop: true
          script: |
            chmod +x "${APP_DIR}/deploy.sh"
            "${APP_DIR}/deploy.sh"
