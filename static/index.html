<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlimX Canvas</title>
    <link rel="stylesheet" href="styles.css?v=20260528-messages-api" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>SlimX Canvas</h1>
          <p>Vertical chat with persistent horizontal deep dives from any assistant answer.</p>
        </div>
        <button id="toggleMetaBtn" class="ghost-btn" type="button">Context</button>
      </header>

      <section id="chatWindow" class="chat-window" aria-label="Chat conversation">
        <div id="messageList" class="message-list"></div>
      </section>

      <aside id="metaPanel" class="meta-panel hidden" aria-label="Context used by AI">
        <div class="meta-head">
          <h2>Context used by AI</h2>
          <button id="closeMetaBtn" class="ghost-btn small" type="button">Close</button>
        </div>
        <pre id="contextPreview"></pre>
      </aside>

      <footer class="composer">
        <div class="composer-inner">
          <div class="composer-meta">
            <span id="branchHint" class="branch-hint">Main thread</span>
            <button id="backToMainBtn" class="back-main composer-back hidden" type="button">← Back to main</button>
          </div>
          <div class="compose-row">
            <label class="sr-only" for="message">Message</label>
            <textarea id="message" rows="1" placeholder="Ask, refine, compare..."></textarea>
            <button id="sendBtn" type="button">Send</button>
          </div>
          <div id="statusMsg" class="status" role="status" aria-live="polite"></div>
        </div>
      </footer>
    </main>

    <template id="assistantTemplate">
      <article class="message assistant branchable">
        <button class="deep-branch" type="button" title="Dig deeper from this answer" aria-label="Dig deeper from this answer">Dig deeper</button>
        <div class="message-card">
          <div class="message-content"></div>
          <div class="detour-tags" aria-label="Collapsed deep dives"></div>
        </div>
      </article>
    </template>

    <script type="module" src="app.js?v=20260528-messages-api"></script>
  </body>
</html>
