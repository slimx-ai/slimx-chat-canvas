services:
  slimx-chat-canvas:
    image: ghcr.io/${GHCR_OWNER}/slimx-chat-canvas:${IMAGE_TAG}
    container_name: slimx-chat-canvas
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      SLIMX_MODEL: "${SLIMX_MODEL:-openai:gpt-4.1-nano}"
      SLIMX_TEMPERATURE: "${SLIMX_TEMPERATURE:-0.2}"
      SLIMX_MAX_TOKENS: "${SLIMX_MAX_TOKENS:-1024}"
      SLIMX_TIMEOUT: "${SLIMX_TIMEOUT:-60}"
      SLIMX_RETRIES: "${SLIMX_RETRIES:-2}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_VERSION: "${ANTHROPIC_VERSION:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
