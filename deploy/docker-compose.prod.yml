services:
  slimx-chat-canvas:
    image: ghcr.io/${GHCR_OWNER}/slimx-chat-canvas:${IMAGE_TAG}
    container_name: slimx-chat-canvas
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      GRADIO_URL: ${GRADIO_URL:-https://gpt.baby-gpt.com}
      GRADIO_MODEL_CHOICE: ${GRADIO_MODEL_CHOICE:-babyGPT_152M_125h.llm}
      GRADIO_API_NAME: ${GRADIO_API_NAME:-/gradio_interface}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
